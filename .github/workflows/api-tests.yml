name: API Engine Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Execute Pipeline via Docker Compose
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from test-runner

      - name: Install Allure CLI
        if: always()
        run: |
          sudo wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure_2.27.0-1_all.deb
          sudo dpkg -i allure_2.27.0-1_all.deb

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Upload Allure HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Tear Down Docker Environment
        if: always()
        run: |
          docker compose down -v
