name: API Engine Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Run Test Suite via Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from test-runner

      - name: Take ownership of test results
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" allure-results

      - name: Add environment metadata
        if: always()
        run: |
          printf '%s\n' "Python=3.11" "Database=PostgreSQL 15" "Stack=pytest, httpx, psycopg2" "Commit=${GITHUB_SHA::7}" > allure-results/environment.properties

      - name: Add executor metadata
        if: always()
        run: |
          cat > allure-results/executor.json <<EOF
          {"name":"GitHub Actions","type":"github","buildName":"Run #${GITHUB_RUN_NUMBER}","buildUrl":"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}","reportUrl":"https://dannyc7765.github.io/transactional-api-engine/","reportName":"Allure Report"}
          EOF
          
      - name: Fetch previous report
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Carry history forward
        if: always()
        run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/history; fi
          
      - name: Generate HTML report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan full history
        run: gitleaks git . --log-opts="--all" --redact -v  